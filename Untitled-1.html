<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeVault - La mia Biblioteca di Codice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>💻 CodeVault</h1>
        <p>Il tuo archivio personale di snippet e soluzioni</p>
    </header>

    <main class="container">
        <section class="form-container">
            <h2>Aggiungi un nuovo Snippet</h2>
            <form id="code-form">
                <div class="form-group">
                    <label for="title">Titolo dello Snippet:</label>
                    <input type="text" id="title" placeholder="Es. Fetch API in JS, Centrare un Div..." required>
                </div>
                
                <div class="form-group">
                    <label for="language">Linguaggio:</label>
                    <select id="language" required>
                        <option value="HTML">HTML</option>
                        <option value="CSS">CSS</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Python">Python</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="code">Codice:</label>
                    <textarea id="code" rows="8" placeholder="Incolla qui il tuo codice..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Salva nella Biblioteca</button>
            </form>
        </section>

        <section class="library-container">
            <h2>I Tuoi Codici Salvati</h2>
            <div id="snippets-grid" class="snippets-grid">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
